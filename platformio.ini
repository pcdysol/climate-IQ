; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; OTA needs two app partitions large enough to hold the firmware. This project
; uses NVS (not SPIFFS), so min_spiffs gives two ~1.9 MB app slots — plenty of
; headroom for the IRremote/MQTT/GSM stack. Requires one serial flash to apply.
board_build.partitions = min_spiffs.csv
lib_deps =
	; MyLD2410 is now a LOCAL fork in lib/LD2412 adapted for the 14-gate HLK-LD2412.
	; Do NOT re-add iavorvel/MyLD2410 here — it is the 9-gate LD2410 driver.
	knolleary/PubSubClient@^2.8
	bblanchon/ArduinoJson@^7.4.2
	adafruit/DHT sensor library@^1.4.6
	crankyoldgit/IRremoteESP8266@^2.9.0
	adafruit/Adafruit HDC1000 Library @ ^2.0.2
	vshymanskyy/TinyGSM @ ^0.12.0
	marvinroger/AsyncMqttClient @ ^0.9.0
