; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; ESP-IDF logging level (0=None 1=Error 2=Warn 3=Info 4=Debug 5=Verbose).
; This core is built with CONFIG_ARDUHAL_ESP_LOG=y, so ESP_LOGx are redefined
; onto the Arduino HAL (log_printf). Every log — ours AND the libraries' — is
; therefore gated purely at COMPILE time by CORE_DEBUG_LEVEL; runtime
; esp_log_level_set() has NO effect on these.
;
; Goal: keep our own per-module INFO logs but silence library chatter
; (AsyncMqttClient's "CONNECTING / snd / ack / _onData ..." spam, i2cInit,
; the Wire/WiFiGeneric warnings, etc.).
;
; We do NOT set CORE_DEBUG_LEVEL globally: PlatformIO applies build_src_flags
; BEFORE build_flags, so a value in build_flags would always override src/ and
; kill our own logs too. Instead we set the level ONLY for src/ here. Libraries
; and the Arduino core get no -DCORE_DEBUG_LEVEL, so they fall back to the core's
; built-in CONFIG_ARDUHAL_LOG_DEFAULT_LEVEL=1 (ERROR) — they emit errors only.
;   src/      -> INFO (3): our ESP_LOGI/W/E lifecycle logs.
;   libs+core -> ERROR (1): only genuine failures, no INFO/WARN noise.
build_src_flags = -DCORE_DEBUG_LEVEL=3
; The PCB self-test (src/selftest.cpp) has its OWN setup()/loop() and is built only
; by [env:selftest] below — exclude it from the normal firmware so the two main()s
; don't collide.
build_src_filter = +<*> -<selftest.cpp>
; Colour-code log levels in the serial monitor (optional, nice to have).
monitor_filters = esp32_exception_decoder, colorize
; OTA needs two app partitions large enough to hold the firmware. This project
; uses NVS (not SPIFFS), so min_spiffs gives two ~1.9 MB app slots — plenty of
; headroom for the IRremote/MQTT/GSM stack. Requires one serial flash to apply.
board_build.partitions = min_spiffs.csv
lib_deps =
	; MyLD2410 is now a LOCAL fork in lib/LD2412 adapted for the 14-gate HLK-LD2412.
	; Do NOT re-add iavorvel/MyLD2410 here — it is the 9-gate LD2410 driver.
	knolleary/PubSubClient@^2.8
	bblanchon/ArduinoJson@^7.4.2
	adafruit/DHT sensor library@^1.4.6
	crankyoldgit/IRremoteESP8266@^2.9.0
	adafruit/Adafruit HDC1000 Library @ ^2.0.2
	vshymanskyy/TinyGSM @ ^0.12.0
	marvinroger/AsyncMqttClient @ ^0.9.0

; ====================================================================
; PCB SELF-TEST firmware (standalone hardware diagnostic).
; Build/flash:   pio run -e selftest -t upload && pio device monitor
; Restore normal firmware:  pio run -e esp32doit-devkit-v1 -t upload
; Inherits the board/framework/libs above but compiles ONLY src/selftest.cpp
; (its own setup()/loop()); none of the production managers/tasks are built.
; ====================================================================
[env:selftest]
extends = env:esp32doit-devkit-v1
build_src_filter = -<*> +<selftest.cpp>
